name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shfmt
        run: |
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64" -o shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/
      - name: Run shfmt
        run: shfmt --diff .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" -o shellcheck.tar.xz
          tar xf shellcheck.tar.xz
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/
          rm -rf shellcheck.tar.xz shellcheck-v0.11.0
      - name: Run shellcheck
        run: |
          shellcheck \
            bin/xcind-application \
            bin/xcind-compose \
            bin/xcind-config \
            bin/xcind-prompt \
            bin/xcind-proxy \
            bin/xcind-run \
            bin/xcind-workspace \
            lib/xcind/xcind-app-lib.bash \
            lib/xcind/xcind-app-env-lib.bash \
            lib/xcind/xcind-assigned-lib.bash \
            lib/xcind/xcind-bootstrap.bash \
            lib/xcind/xcind-completion-bash.bash \
            lib/xcind/xcind-completion-zsh.bash \
            lib/xcind/xcind-discovery-lib.bash \
            lib/xcind/xcind-host-gateway-lib.bash \
            lib/xcind/xcind-hostenv-lib.bash \
            lib/xcind/xcind-lib.bash \
            lib/xcind/xcind-naming-lib.bash \
            lib/xcind/xcind-proxy-lib.bash \
            lib/xcind/xcind-registry-lib.bash \
            lib/xcind/xcind-run-lib.bash \
            lib/xcind/xcind-workspace-lib.bash \
            test/run-tests.sh \
            test/test-xcind.sh \
            test/test-xcind-proxy.sh \
            test/test-xcind-prompt.sh \
            test/test-xcind-completion.sh \
            test/lib/assert.sh \
            test/lib/setup.sh \
            install.sh \
            uninstall.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - macos-14
          - macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # test/run-tests.sh runs the files in parallel with per-file buffered
      # logs, matching `make test`. The prompt and completion suites are
      # pure bash + coreutils, so they run on all four matrix OSes;
      # completion blocks that need optional tooling (docker CLI, zsh)
      # report themselves as skipped rather than failing.
      - name: Run tests
        if: startsWith(matrix.os, 'ubuntu-')
        run: bash test/run-tests.sh
      # test/test-xcind-proxy.sh has preexisting portability gaps on macOS /
      # Alpine (e.g. BSD stat, LibreSSL option differences, bash 3.2 quirks)
      # that surface when the suite actually runs there. Gate it to ubuntu
      # until those are fixed — the reviewer's ask (TLS tests run in CI) is
      # still satisfied on ubuntu-22.04 / ubuntu-24.04.
      - name: Run tests (without proxy suite)
        if: startsWith(matrix.os, 'macos-')
        run: bash test/run-tests.sh test-xcind.sh test-xcind-prompt.sh test-xcind-completion.sh

  kislyuk-yq-compat:
    # Xcind's yq usage is read-only jq-syntax filters, compatible with both
    # mikefarah/yq-go (the blessed, pinned implementation) and kislyuk/yq
    # (a common Python alternative on user PATHs). This job locks in that
    # compatibility by running the full suite set against kislyuk/yq + jq
    # instead of yq-go.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kislyuk/yq + jq
        # Installed into a venv outside $HOME (not `pip install --user`):
        # the test suite legitimately overrides $HOME for isolation in many
        # cases, and `--user` installs resolve against $HOME at import time,
        # so a kislyuk/yq installed that way silently breaks (Python can't
        # find its own package) the moment a test swaps $HOME out. A venv's
        # site-packages live under its own prefix, so it stays reachable
        # regardless of the test's $HOME.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          python3 -m venv /opt/kislyuk-yq-venv
          /opt/kislyuk-yq-venv/bin/pip -q install yq
          sudo ln -sf /opt/kislyuk-yq-venv/bin/yq /usr/local/bin/yq
      # Same three suites as before the parallel runner; the completion
      # suite has no yq usage to lock in, so it stays out of this job.
      - name: Run core, proxy, and prompt tests
        run: bash test/run-tests.sh test-xcind.sh test-xcind-proxy.sh test-xcind-prompt.sh

  npm-install-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
      - name: Pack and install globally
        run: |
          npm pack
          npm install -g ./scinddev-xcind-*.tgz
      - name: Verify xcind-compose is on PATH
        run: command -v xcind-compose
      - name: Verify xcind-config is on PATH
        run: command -v xcind-config

  bash-version:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bashver:
          - "3.2"
          - "4.0"
          - "4.4"
          - "5.0"
          - "5.1"
          - "5"
          - latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build image (bash ${{ matrix.bashver }})
        run: docker build --build-arg "BASHVER=${{ matrix.bashver }}" -t "xcind-test:${{ matrix.bashver }}" .
      - name: Run tests in container
        # bash-version exercises test-xcind.sh, test-xcind-prompt.sh and
        # test-xcind-completion.sh (all pure bash + coreutils, so they must
        # pass on the project min, Bash 3.2 — the completion suite most of
        # all, since COMPREPLY/compgen idioms differ across versions). The
        # proxy suite has preexisting portability gaps against Alpine / bash 3.2
        # and stays out of this matrix. Track as follow-up.
        # One container runs all three suites through the parallel runner
        # (which is itself Bash 3.2 compatible); the read-only mount is
        # fine because the runner buffers logs under mktemp in /tmp.
        run: |
          docker run --rm \
            -v "$PWD:/opt/xcind:ro" \
            -w /opt/xcind \
            --entrypoint bash \
            "xcind-test:${{ matrix.bashver }}" \
            test/run-tests.sh test-xcind.sh test-xcind-prompt.sh test-xcind-completion.sh
